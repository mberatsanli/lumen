<!doctype html>
<html>
<head>
  <title>Lumen JS test</title>
  <style>
    body { font-size: 16px; color: #232019; background-color: #f2f0ea; }
    .card { max-width: 560px; margin: 24px auto; background-color: #ffffff;
            padding: 24px; border-radius: 10px;
            box-shadow: 0 6px 18px #00000033; }
    h1 { font-size: 24px; margin-top: 0; }
    .row { margin: 14px 0; }
    button { background-color: #2266aa; color: #ffffff; border: 1px solid #1c5288;
             border-radius: 6px; padding: 8px 16px; font-size: 14px; }
    button:hover { background-color: #1c5288; }
    .big { font-size: 28px; font-weight: 700; color: #2266aa; }
    input[type=text] { width: 240px; border: 1px solid #b9b2a2; border-radius: 4px;
                       padding: 6px 8px; font-size: 14px; }
    .hint { color: #8a8272; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>JavaScript testi</h1>

    <div class="row">
      <button id="artir">Artır +1</button>
      <button id="sifirla">Sıfırla</button>
      <span class="big" id="sayac">0</span>
    </div>

    <div class="row">
      <input type="text" id="isim" placeholder="Adını yaz…">
      <p id="selam">Merhaba, dünya!</p>
    </div>

    <div class="row">
      <p>Saat (500ms interval): <span class="big" id="saat">0.0s</span></p>
    </div>

    <p class="hint">Butonlar addEventListener ile bağlı; yazı alanı input
      event'iyle selamı günceller; sayaç setInterval ile ilerler.
      console.log çıktısı terminale düşer.</p>
  </div>

  <script>
    let count = 0;
    const sayac = document.getElementById('sayac');
    document.getElementById('artir').addEventListener('click', function() {
      count++;
      sayac.textContent = count;
      console.log('count =', count);
    });
    document.getElementById('sifirla').addEventListener('click', () => {
      count = 0;
      sayac.textContent = '0';
    });

    const isim = document.getElementById('isim');
    isim.addEventListener('input', () => {
      const name = isim.value.trim();
      document.getElementById('selam').textContent =
        name === '' ? 'Merhaba, dünya!' : 'Merhaba, ' + name.toUpperCase() + '!';
    });

    let ticks = 0;
    setInterval(function() {
      ticks++;
      document.getElementById('saat').textContent = (ticks / 2) + 's';
    }, 500);

    console.log('page script ready:', typeof sayac, [1,2,3].map(x => x * x).join('+'));
  </script>
</body>
</html>
