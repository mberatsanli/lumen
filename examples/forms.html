<!doctype html>
<html>
<head>
  <title>Lumen form test</title>
  <style>
    :root { --brand: #2266aa; }
    body { font-size: 16px; color: #232019; background-color: #f2f0ea; }
    .card { max-width: 560px; margin: 24px auto; background-color: #ffffff;
            padding: 24px; border-radius: 10px;
            box-shadow: 0 6px 18px #00000033; }
    h1 { font-size: 24px; margin-top: 0; }
    .row { margin: 12px 0; }
    .row span.label { display: inline-block; width: 140px; color: #55524c; }
    input[type=text], input[type=search], input[type=password], input[type=email] {
      width: 260px; border: 1px solid #b9b2a2; border-radius: 4px;
      padding: 6px 8px; background-color: #fffdf8; font-size: 14px;
    }
    input[type=text]:focus, input[type=search]:focus,
    input[type=password]:focus, input[type=email]:focus {
      border-color: var(--brand); outline: 2px solid #2266aa55;
    }
    input[type=submit] {
      background-color: var(--brand); color: #ffffff; border: 1px solid #1c5288;
      border-radius: 6px; padding: 8px 20px; font-size: 14px;
      transition: background-color 200ms ease;
    }
    input[type=submit]:hover { background-color: #b3261e; }
    input[type=submit]:active { background-color: #7a1712; }
    .hint { color: #8a8272; font-size: 13px; }
    .checks input { margin-right: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Form testi</h1>
    <p class="hint">Alanlara tıkla, yaz; ok tuşları, Shift+ok seçim, Cmd/Ctrl+A/C/X/V
      çalışır. Enter veya “Gönder” GET submit yapar.</p>
    <form action="forms-result.html">
      <div class="row"><span class="label">Ad</span>
        <input type="text" name="ad" placeholder="Adını yaz…"></div>
      <div class="row"><span class="label">E-posta</span>
        <input type="email" name="eposta" value="ben@ornek.dev"></div>
      <div class="row"><span class="label">Parola</span>
        <input type="password" name="parola" value="gizli"></div>
      <div class="row"><span class="label">Arama</span>
        <input type="search" name="q" placeholder="Bir şey ara…"></div>
      <div class="row checks"><span class="label">Seçenekler</span>
        <input type="checkbox" name="haber" value="1" checked> bülten
        <input type="checkbox" name="sartlar" value="ok"> şartlar
      </div>
      <div class="row checks"><span class="label">Boyut</span>
        <input type="radio" name="boyut" value="s"> S
        <input type="radio" name="boyut" value="m" checked> M
        <input type="radio" name="boyut" value="l"> L
      </div>
      <input type="hidden" name="kaynak" value="lumen">
      <div class="row"><span class="label"></span>
        <input type="submit" value="Gönder"></div>
    </form>
    <p class="hint">Gönderince <code>forms-result.html?ad=...&eposta=...</code>
      adresine gider — adres çubuğunda query’yi gör.</p>
  </div>
</body>
</html>
