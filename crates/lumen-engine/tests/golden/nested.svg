<text x="58" y="144.4" fill="#2d2a24" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Inner panel</text>
<text x="58" y="176.4" fill="#2d2a24" font-family="system-ui, sans-serif" font-size="16" font-weight="400">Nested one level deeper, with its own border and padding.</text>
