<text x="41" y="61" fill="#2d2a24" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Outer panel</text>
<text x="41" y="93" fill="#2d2a24" font-family="system-ui, sans-serif" font-size="16" font-weight="400">This panel contains another panel. Borders, paddings and margins all take real space in the box model.</text>
