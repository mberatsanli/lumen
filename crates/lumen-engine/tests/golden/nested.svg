<text x="75" y="231.79999" fill="#2d2a24" font-family="system-ui, sans-serif" font-size="16" font-weight="400">And one more level, because layout bugs love depth.</text>
<text x="823" y="260.19998" fill="#8a8272" font-family="system-ui, sans-serif" font-size="14" font-weight="400">right-aligned note</text>
